<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff9800,#ff5722);
    color:white;
    text-align:center;
}

header{
    padding:60px 20px;
}

h1{
    font-size:60px;
    margin:0;
}

p{
    font-size:22px;
}

.button{
    display:inline-block;
    margin-top:25px;
    padding:15px 35px;
    background:white;
    color:#ff5722;
    text-decoration:none;
    border-radius:12px;
    font-size:22px;
    font-weight:bold;
    transition:0.3s;
}

.button:hover{
    background:#ffe0b2;
    transform:scale(1.05);
}

section{
    background:white;
    color:#333;
    margin:40px auto;
    width:80%;
    max-width:800px;
    border-radius:20px;
    padding:30px;
}

footer{
    padding:20px;
    opacity:0.8;
}
</style>

</head>
<body>

<header>
<h1>🥓 KOVBASA</h1>
<p>Добро пожаловать на мой сайт!</p>

</header>

<section>
<h2>О сайте</h2>

<p>
Это мой первый сайт, созданный на HTML, CSS и JavaScript.
</p>

<p>
Здесь скоро появятся новые страницы, фотографии и проекты.
</p>

</section>

<footer>
© 2026 KOVBASA
</footer>

<script>
function hello(){
    alert("Привет! Спасибо, что посетил сайт KOVBASA! 🎉");
}
</script>
